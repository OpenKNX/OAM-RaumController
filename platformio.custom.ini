; get rid of global SAMD_FLASH definition
[RP2040_FLASH]
build_flags =
  -D KNX_FLASH_SIZE=0xC000
  -D KNX_FLASH_OFFSET=0xF0000
  -D OPENKNX_FLASH_SIZE=0x4000
  -D OPENKNX_FLASH_OFFSET=0xFC000
  

[RP2350_DEBUG_SERVER]
debug_server = 
    C:\Program Files\SEGGER\JLink\JLinkGDBServerCL
    -nohalt
    -nologtofile
    -endian 
    little
    -if
    SWD
    -speed
    4000
    -select
    USB
    -port
    2331
    -device
    RP2350_M33_0

;
; customer build_flags
;
[custom]
lib_ldf_mode = chain
build_flags =
  ; the following 2 lines are necessary to support ldf_mode chain
  -I lib/OGM-HardwareConfig/include/
  ; normal project settings
  -D LOGICMODULE
  -D OPENKNX_SUN_POSITION
  -D KNX_FLASH_CALLBACK
  -D SERIAL_DEBUG=Serial
  -D OPENKNX_LOOPTIME_WARNING=100
  -D OPENKNX_MAX_MODULES=18
  -D OPENKNX_OVERRIDE_MASK_VERSION=0x07B0
  ; -D KNX_AUTO_ADAPT
  ; -D KNX_WAIT_FOR_ADDR # ensures rx of an address (GA or PA) with higher ACK probability, but takes 7ms in knx.loop()!
  ; -D OPENKNX_LOOPTIME_WARNING=13 # should be set with KNX_WAIT_FOR_ADDR to OPENKNX_LOOPTIME_WARNING + 7
lib_ignore = 
  lwIP_ESPHost

; debug parameters
[custom_develop]
extends = custom
build_flags = 
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
  -D OPENKNX_DEBUG
  -D ONEWIRE_TRACE_SEARCH=none
  ; -D OPENKNX_HEARTBEAT_PRIO
  ; -D OPENKNX_RTT
  ; -D BUFFER_SIZE_UP=10240
  ; -D DEBUG_LOOP_TIME=10  ; will print a info when a loop took more than x ms.
  ; -D LOGIC_TRACE
  ; ; to see trace logs, they must match one of the 5 filters (TRACE_LOG1 .. TRACE_LOG2)
  ; "-D OPENKNX_TRACE1=Common.*"
  ; "-D OPENKNX_TRACE2=Flash.*"
debug_build_flags = 
  -ggdb3
 
[custom_releases]
extends = custom
build_flags =
  ${custom.build_flags}

; this config block is for specifing options that are valid for all RP2040-based builds
[RP2040_custom]
extends = RP2040, custom
; platform = https://github.com/maxgerhardt/platform-raspberrypi.git#0b2e90a
; platform_packages = framework-arduinopico @ https://github.com/earlephilhower/arduino-pico/releases/download/2.7.3/rp2040-2.7.3.zip
; board = pipico
build_flags = 
  ${RP2040.build_flags}
  -D USE_KNX_DMA_UART=0
  -D USE_KNX_DMA_IRQ=0
  ; -D KNX_UART_NUM 0
  -Wunused-variable
  ; -iC:/Users/waldemar.porscha@sap.com/.platformio/packages/framework-arduinopico
  ; "@C:/Users/waldemar.porscha@sap.com/.platformio/packages/framework-arduinopico/lib/platform_inc.txt"
  ;-D NCN5120

; this config block is for specifing options that are valid for all RP2040-based develop/debug builds
[RP2040_custom_develop]
extends = RP2040_develop, RP2040_custom, custom_develop
build_flags = 
  ${RP2040_develop.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_develop.build_flags}
  ; -D BOARD_AB_PRE
  ; -D BOARD_AB_PRE_MR16
  ; -D BOARD_AB_PRE_WALL
  ; -D BOARD_AB_PRE_WALL_OUT
  ; -D BOARD_UP1_SENSOR_1KANAL
  -D DEVICE_SMARTMF_SENSORMODUL
  ; -D DEVICE_SMARTMF_1WIRE_1CH
  -D WIREMODULE
  ; -D InputADC_Output
  -D PRESENCEMODULE
  ; -D PMMODULE
  ; -D HF_SERIAL=Serial2
  -L../OGM-SensorDevices/src/bsec2/cortex-m0plus
  -lalgobsec
debug_build_flags = 
  ${custom_develop.debug_build_flags}
  -O0 

; this config block is for specifing options that are valid for all RP2040-based release builds
[RP2040_release]
extends = RP2040_releases, custom, UPLOAD_JLINK
build_flags = 
  ${RP2040_releases.build_flags}
  -D KNX_UART_NUM=0
  -O0
  -L../OGM-SensorDevices/src/bsec2/cortex-m0plus
  -lalgobsec
debug_build_flags =
  ; -D OPENKNX_LOOPTIME_WARNING=10
  -D OPENKNX_WAIT_FOR_SERIAL=5000
  -D OPENKNX_DEBUG
  -D OPENKNX_DEBUGGER
  -D OPENKNX_HEARTBEAT
  -ggdb3
  -O0

[RP2350_release]
extends = RP2040_releases, custom, UPLOAD_JLINK
build_flags = 
  ${RP2040_releases.build_flags}
  -O0
  -L../OGM-SensorDevices/src/bsec2/cortex-m33
  -lalgobsec
debug_build_flags =
  ${RP2040_release.debug_build_flags}

[ESP_release]
extends = ESP32_releases, custom
build_flags =
  ${ESP32_releases.build_flags}
  ${custom.build_flags}
  -D OPENKNX_USB_EXCHANGE_IGNORE
  ; -L../OGM-SensorDevices/src/bsec2/esp32
  ; -lalgobsec
debug_build_flags =
  -D OPENKNX_WAIT_FOR_SERIAL=5000
  -D OPENKNX_DEBUG
  -D OPENKNX_DEBUGGER
  -ggdb3
  -O0




[env:develop_RP2040_USB]
extends = RP2040_custom_develop, RP2040_EXCHANGE_16MB
build_flags = 
  ${RP2040_custom_develop.build_flags}
  ${RP2040_EXCHANGE_16MB.build_flags}

[env:develop_RP2040_JLINK]
